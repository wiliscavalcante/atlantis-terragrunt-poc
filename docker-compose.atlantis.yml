version: "3.8"

services:
  atlantis:
    build:
      context: .
      dockerfile: Dockerfile.atlantis
    ports:
      - "4141:4141"
    env_file:
      - .env
    environment:
      ATLANTIS_REPO_ALLOWLIST: "github.com/wiliscavalcante/atlantis-terragrunt-poc"
      ATLANTIS_CONFIG: "/atlantis/atlantis.yaml"
      ATLANTIS_REPO_CONFIG: "/atlantis/atlantis.server.yaml"
      ATLANTIS_DATA_DIR: "/atlantis-data"
    volumes:
      - ".:/atlantis"
      - "atlantis-data:/atlantis-data"
    command: server

volumes:
  atlantis-data:
